name: ${COMPOSE_PROJECT_NAME:-krea}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-krea}
    volumes:
      - krea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-krea}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - krea_minio_data:/data
    networks:
      - internal

  minio_setup:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-uploads};
      mc anonymous set download local/${MINIO_BUCKET:-uploads};
      "
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio_setup:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ENFORCE_HTTPS_REDIRECTION: ${ENFORCE_HTTPS_REDIRECTION:-false}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-krea}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
      MINIO_BASE_URL: ${MINIO_BASE_URL:-}
      USE_FAKE_EMAIL: ${USE_FAKE_EMAIL:-true}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-true}
      SEEDING_ENABLED: ${SEEDING_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@krea.local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrator}
      INSTANCE_PLATFORM_NAME: ${INSTANCE_PLATFORM_NAME:-Krea}
      INSTANCE_DESCRIPTION: ${INSTANCE_DESCRIPTION:-A federated platform for artists and creators}
      INSTANCE_ADMIN_EMAIL: ${INSTANCE_ADMIN_EMAIL:-admin@krea.local}
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      JWT_KEY: ${JWT_KEY:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${WEB_PORT:-3000}:8080"
    volumes:
      - krea_app_data:/data
    networks:
      - internal

volumes:
  krea_pgdata:
  krea_minio_data:
  krea_app_data:

networks:
  internal:
    driver: bridge
