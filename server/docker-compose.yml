services:
  postgres:
    image: postgres:16-alpine
    container_name: krea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - krea_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: krea-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - krea_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  krea_pgdata:
  krea_minio_data: