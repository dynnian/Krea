services:
  postgres:
    image: postgres:16-alpine
    container_name: krea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - krea_pgdata:/var/lib/postgresql/data
  minio:
    image: minio/minio
    container_name: krea-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - krea_minio_data:/data
    command: server /data --console-address ":9001"
    # El healthcheck le avisa a los demás cuando MinIO ya despertó
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc
    container_name: krea-minio-setup
    depends_on:
      minio:
        condition: service_healthy # Solo arranca cuando el healthcheck de arriba pase
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/uploads;
      mc anonymous set download myminio/uploads;
      echo 'Políticas de acceso aplicadas con éxito';
      "

volumes:
  krea_pgdata:
  krea_minio_data: